[pytest]
testpaths = tests
pythonpath = .

# Deprecations are shown but do not fail the run. Turning them into errors is
# good hygiene for this project's own code, but the filter cannot reliably tell
# our warnings from a dependency's, and on a newly released Python the libraries
# are often noisy before they catch up. Failing there would tell someone their
# checkout is broken when it is not.
#
# To tighten this in CI, where the environment is pinned:
#     pytest -W error::DeprecationWarning
filterwarnings =
    default::DeprecationWarning
